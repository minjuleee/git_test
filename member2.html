<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>한희성</div>
    <div>자양동</div>
    <div class="menu">
      <h2>요리 레시피</h2>
      <h3>재료</h3>
      <ul>
          <li>스파게티 면 200g</li>
          <li>베이컨 100g</li>
          <li>달걀 2개</li>
          <li>파마산 치즈 50g</li>
      </ul>
      <h3>조리 순서</h3>
      <ol>
        <li>
          준비 작업
          <ul>
            <li>베이컨을 작게 자릅니다</li>
            <li>치즈를 갈아둡니다</li>
          </ul>
        </li>
        <li>
          조리 시작
          <ol type="a">
            <li>물을 끓입니다</li>
            <li>면을 8분간 삶습니다</li>
          </ol>
        </li>
        <li>
          마무리
          <ul>
            <li>베이컨을 볶습니다</li>
            <li>면과 함께 버무립니다</li>
            <li>치즈를 뿌립니다</li>
          </ul>
        </li>
      </ol>
    </div>
</body>
</html>
